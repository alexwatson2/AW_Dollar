name: Android APK
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    # Avoid silently moving to a new runner/SDK when ubuntu-latest changes.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Modern sdkmanager requires Java 21; app sources still target Java 17.
          java-version: '21'
      - name: Check compact widget layout
        run: |
          python3 ci/check_widget.py
          python3 ci/check_database.py
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare preinstalled Android SDK
        run: |
          python3 ci/run.py sdk bash -euc '
            sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
            test -n "$sdk_root"
            sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
            test -x "$sdkmanager"
            java -version
            "$sdkmanager" --version
            "$sdkmanager" --licenses < <(printf "y\n%.0s" {1..100})
            "$sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          '
      - name: Test, lint and build installable debug APK
        run: python3 ci/run.py gradle ./gradlew --no-daemon --console=plain --stacktrace testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AW-Dollar-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-reports
          path: |
            android/build/ci/
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/lint-results-debug.xml
          if-no-files-found: warn
